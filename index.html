<title>TREASURE TEMARAM - Full Group</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,system-ui;height:100vh;display:flex;flex-direction:column}
.top{background:#000;padding:10px 14px;border-bottom:1px solid #222}
#lock{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#15151f;padding:30px 24px;border-radius:20px;width:100%;max-width:340px;text-align:center;border:1px solid #222}
.card input{width:100%;padding:14px;margin-top:16px;border-radius:12px;background:#000;border:1px solid #333;color:#fff;font-size:20px;text-align:center;letter-spacing:4px}
.card button{width:100%;margin-top:14px;padding:14px;border-radius:12px;border:0;background:#f5d76e;font-weight:800}
.err{color:#ff4444;font-size:12px;margin-top:10px;display:none}
#chat{display:none;flex-direction:column;flex:1;background:#000;overflow:hidden}
.group-head{padding:10px;text-align:center;border-bottom:1px solid #111;background:#0a0a0a}
.group-head .pics{display:flex;justify-content:center;gap:-6px;margin-bottom:6px}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid #000;margin-left:-6px;background:#333;display:flex;align-items:center;justify-content:center;font-size:12px}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:2px}
.row{margin-top:8px;display:flex;max-width:85%}
.row.right{align-self:flex-end}
.row.left{align-self:flex-start}
.bubble{padding:8px 14px;border-radius:18px;font-size:14px}
.left .bubble{background:#23232e}
.right .bubble{background:#0a84ff;color:#fff}
.name{font-size:11px;color:#f5d76e;margin-top:10px}
.time{font-size:10px;opacity:.6;margin-left:6px}
.bar{padding:8px;background:#111;border-top:1px solid #222;display:flex;gap:8px}
.bar input{flex:1;background:#1c1c1e;border:0;border-radius:20px;padding:11px 14px;color:#fff;outline:none}
